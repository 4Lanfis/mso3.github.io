    <script type="text/babel">
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playBeep(freq = 600, duration = 0.08, type = 'sine') {
                if (this.isMuted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {
                    console.error("Audio error:", e);
                }
            }

            playSuccess() {
                if (this.isMuted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        setTimeout(() => {
                            this.playBeep(freq, 0.12, 'triangle');
                        }, idx * 80);
                    });
                } catch(e) {
                    console.error("Audio error:", e);
                }
            }

            playError() {
                if (this.isMuted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    this.playBeep(180, 0.18, 'sawtooth');
                    setTimeout(() => this.playBeep(130, 0.22, 'sawtooth'), 100);
                } catch(e) {
                    console.error("Audio error:", e);
                }
            }
        }

        function App() {
            const [currentView, setCurrentView] = React.useState('intro'); // 'intro', 'station1', 'station2', 'station3', 'finale'

            const [inputs, setInputs] = React.useState({ 1: '', 2: '', 3: '' });
            const [errors, setErrors] = React.useState({ 1: '', 2: '', 3: '' });
            const [unlockedClues, setUnlockedClues] = React.useState({ 1: [0], 2: [0], 3: [0] });
            const [copiedCoords, setCopiedCoords] = React.useState(false);

            // Audio & Mobile Navigation helper
            const handleNav = (viewName) => {
                audio.playBeep(700, 0.05);
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(20);
                }
                setCurrentView(viewName);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const unlockNextClue = (stId) => {
                audio.playBeep(850, 0.07);
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(30);
                }
                setUnlockedClues(prev => {
                    const currentClues = prev[stId];
                    if (currentClues.length < stationDatabase[stId].clues.length) {
                        return { ...prev, [stId]: [...currentClues, currentClues.length] };
                    }
                    return prev;
                });
            };

            const handleAnswerSubmit = (stId, e) => {
                e.preventDefault();
                const rawInput = inputs[stId] || '';
                const cleanInput = rawInput.trim().toLowerCase().replace(/\s+/g, ' ');
                const validList = stationDatabase[stId].validAnswers;

                if (validList.includes(cleanInput)) {
                    audio.playSuccess();
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate([40, 60, 40]);
                    }
                    setSolvedStations(prev => ({ ...prev, [stId]: true }));
                    setErrors(prev => ({ ...prev, [stId]: '' }));
                } else {
                    audio.playError();
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate([100, 50, 100]);
                    }
                    setErrors(prev => ({ 
                        ...prev, 
                        [stId]: 'FALSCHE ANTWORT! Lies die Hinweise noch einmal gründlich.' 
                    }));
                }
            };

            const copyCoordinates = () => {
                const textToCopy = '52° 01\' 14.2" N 7° 12\' 58.6" E';

                document.body.appendChild(el);

                setTimeout(() => setCopiedCoords(false), 3000);
            };

            return (
                <div className="flex-1 flex flex-col max-w-lg w-full mx-auto p-3 sm:p-4 pb-6">

                            </h1>
                        </div>

                            Mystery-Multi by 4Lanfis
                        </div>
                    </header>

                    {/* Smartphone-Optimized Station Nav */}

                                    <span className="text-xl">➔</span>
                                </button>
                            </div>
                        )}

                        {}
                        {['station1', 'station2', 'station3'].includes(currentView) && (() => {

                            const isSolved = solvedStations[stId];

                                        </div>

                                        {/* Neutral Graphic */}
                                        <StationGraphic stationId={stId} />

                                        {/* Central Question Prompt */}
                                        <div className="bg-slate-950 p-3 rounded-xl border border-amber-500/30 text-center">
                                            <span className="text-[10px] font-mono-code text-amber-400/80 uppercase block mb-0.5">ERMITTLUNGSFRAGE</span>
                                            <h3 className="text-base font-bold text-amber-300">
                                                "Was hat Hermann Flake hier verloren?"
                                            </h3>
                                            <p className="text-[11px] text-slate-400 mt-0.5">
                                                Ort: <span className="text-slate-200 font-medium">{data.location}</span>
                                            </p>
                                        </div>

                                        {/* Clues Section */}
                                        <div className="space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[10px] font-mono-code text-slate-400 uppercase">AKTEN-HINWEISE ({visibleClueIndexes.length}/{totalClues})</span>
                                                {visibleClueIndexes.length < totalClues && !isSolved && (
                                                    <button
                                                        onClick={() => unlockNextClue(stId)}
                                                        className="text-[11px] font-mono-code bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-lg touch-active transition-all"
                                                    >
                                                        + HINWEIS FREISCHALTEN
                                                    </button>
                                                )}
                                            </div>

                                            {visibleClueIndexes.map(idx => {
                                                const clue = data.clues[idx];
                                                return (
                                                    <div key={clue.id} className="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800 text-xs space-y-0.5">
                                                        <div className="text-[10px] font-mono-code text-amber-400/90 font-semibold">
                                                            {clue.title}
                                                        </div>
                                                        <p className="text-slate-300 leading-snug">
                                                            {clue.text}
                                                        </p>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Solve Form / Reflection */}
                                        {isSolved ? (
                                            <div className="bg-emerald-950/40 border border-emerald-500/40 p-3 rounded-xl space-y-1 glow-green">
                                                <div className="flex items-center gap-1.5 text-emerald-400 font-bold font-mono-code text-xs">
                                                    <span>✓</span> ERMITTLUNGSERFOLG
                                                </div>
                                                <p className="text-xs text-emerald-200 leading-relaxed">
                                                    {data.reflection}
                                                </p>
                                            </div>
                                        ) : (
                                            <form onSubmit={(e) => handleAnswerSubmit(stId, e)} className="space-y-2 pt-1">
                                                <div>
                                                    <label className="block text-[10px] font-mono-code text-slate-400 mb-1">
                                                        ANTWORT EINGEBEN:
                                                    </label>
                                                    <input
                                                        type="text"
                                                        value={inputs[stId] || ''}
                                                        onChange={(e) => setInputs({ ...inputs, [stId]: e.target.value })}
                                                        placeholder="Gesuchten Gegenstand eingeben..."
                                                        className="w-full bg-slate-950 border border-slate-700 focus:border-amber-500 rounded-lg px-3 py-3 text-slate-100 font-mono-code text-base outline-none transition-all placeholder:text-slate-600"
                                                    />
                                                </div>

                                                {errors[stId] && (
                                                    <div className="p-2.5 bg-red-950/60 border border-red-500/40 text-red-300 text-xs rounded-lg font-mono-code">
                                                        ⚠️ {errors[stId]}
                                                    </div>
                                                )}

                                                <button
                                                    type="submit"
                                                    className="w-full py-3.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg shadow touch-active transition-all font-mono-code uppercase text-xs cursor-pointer"
                                                >
                                                    ANTWORT ÜBERPRÜFEN
                                                </button>
                                            </form>
                                        )}
                                    </div>

                                    {/* Navigation Next/Prev */}
                                    <div className="flex justify-between items-center gap-2">
                                        <button
                                            onClick={() => handleNav(stId === 1 ? 'intro' : `station${stId - 1}`)}
                                            className="flex-1 py-3 px-2 bg-slate-900 border border-slate-800 text-slate-300 rounded-xl font-mono-code text-xs text-center touch-active transition-all"
                                        >
                                            ◄ ZURÜCK
                                        </button>

                                        {stId < 3 ? (
                                            <button
                                                onClick={() => handleNav(`station${stId + 1}`)}
                                                className="flex-1 py-3 px-2 bg-amber-500/20 border border-amber-500/50 text-amber-300 rounded-xl font-mono-code text-xs font-bold text-center touch-active transition-all"
                                            >
                                                STATION {stId + 1} ➔
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => {
                                                    if (solvedStations[1] && solvedStations[2] && solvedStations[3]) {
                                                        handleNav('finale');
                                                    } else {
                                                        audio.playError();
                                                        alert("Löse zuerst alle 3 Stationen!");
                                                    }
                                                }}
                                                className={`flex-1 py-3 px-2 border rounded-xl font-mono-code text-xs font-bold text-center touch-active transition-all ${
                                                    solvedStations[1] && solvedStations[2] && solvedStations[3]
                                                        ? 'bg-emerald-500 text-slate-950 border-emerald-400 glow-green'
                                                        : 'bg-slate-900 border-slate-800 text-slate-500'
                                                }`}
                                            >
                                                GEOCACHE-ZIEL ➔
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })()}

                        {}
                        {currentView === 'finale' && (
                            <div className="flex-1 flex flex-col justify-between space-y-4">
                                <div className="bg-slate-900/95 border border-emerald-500/40 rounded-xl p-4 space-y-4 shadow-2xl glow-green text-center">
                                    <div className="inline-block px-3 py-0.5 bg-emerald-500/10 border border-emerald-500/30 rounded-full text-emerald-400 font-mono-code text-[11px] uppercase tracking-wider">
                                        GEOCACHE-FINALE FREIGESCHALTET
                                    </div>

                                    <h2 className="text-xl font-bold text-slate-100">
                                        Das Versteck von den 4Lanfis
                                    </h2>

                                    <p className="text-xs text-slate-300 leading-relaxed text-left">
                                        Sämtliche Ausrüstungsgegenstände der Reinigungskraft <strong>Hermann Flake</strong> wurden geborgen! Seine Fluchtspur quer durch Rosendahl, Coesfeld und Billerbeck führt direkt zu den Ziel-Koordinaten des Geocaches.
                                    </p>

                                    {/* Final Radar Graphic */}
                                    <div className="bg-slate-950 p-3 rounded-xl border border-emerald-500/30 flex flex-col items-center">
                                        <svg viewBox="0 0 200 200" className="w-36 h-36 my-1">
                                            <circle cx="100" cy="100" r="90" fill="none" stroke="#059669" strokeWidth="1" strokeDasharray="3 3" />
                                            <circle cx="100" cy="100" r="60" fill="none" stroke="#059669" strokeWidth="1" />
                                            <circle cx="100" cy="100" r="30" fill="none" stroke="#059669" strokeWidth="1" />
                                            <line x1="100" y1="10" x2="100" y2="190" stroke="#059669" strokeWidth="1" />
                                            <line x1="10" y1="100" x2="190" y2="100" stroke="#059669" strokeWidth="1" />
                                            
                                            {/* Target Marker */}
                                            <circle cx="125" cy="75" r="8" fill="#ef4444" className="animate-ping" opacity="0.7" />
                                            <circle cx="125" cy="75" r="6" fill="#ef4444" />
                                            <line x1="125" y1="60" x2="125" y2="90" stroke="#fca5a5" strokeWidth="2" />
                                            <line x1="110" y1="75" x2="140" y2="75" stroke="#fca5a5" strokeWidth="2" />
                                        </svg>
                                        <span className="text-[10px] font-mono-code text-slate-400 uppercase mt-1">GEOCACHE ANOMALIE LOKALISIERT</span>
                                    </div>

                                    {/* Smartphone Friendly Coordinates Box */}
                                    <div className="bg-slate-950 p-3 rounded-xl border border-emerald-500/50 space-y-1">
                                        <span className="text-[10px] font-mono-code text-emerald-400 uppercase tracking-wider block">FINAL KOORDINATEN</span>
                                        <div className="text-lg sm:text-2xl font-bold font-mono-code text-amber-400 tracking-wider">
                                            52° 01' 14.2" N  7° 12' 58.6" E
                                        </div>
                                    </div>

                                    {/* Mobile Action Buttons */}
                                    <div className="flex flex-col gap-2 pt-1">
                                        <button
                                            onClick={copyCoordinates}
                                            className="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg font-mono-code text-xs font-bold touch-active transition-all"
                                        >
                                            {copiedCoords ? '✓ KOORDINATEN KOPIERT!' : '📋 KOORDINATEN KOPIEREN'}
                                        </button>
                                        <a
                                            href="https://www.google.com/maps/search/?api=1&query=52.020611,7.216278"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-lg font-mono-code text-xs font-bold flex items-center justify-center gap-2 shadow touch-active transition-all"
                                        >
                                            <span>🗺️ IN MAPS ÖFFNEN</span>
                                        </a>
                                    </div>
                                </div>

                                <button
                                    onClick={() => handleNav('intro')}
                                    className="w-full py-3 bg-slate-900 border border-slate-800 text-slate-400 rounded-xl font-mono-code text-xs touch-active transition-all"
                                >
                                    ◄ ZURÜCK ZUR CHRONIK
                                </button>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="mt-4 pt-2 border-t border-slate-900 text-center font-mono-code text-[10px] text-slate-500">
                        MS. - OSTERWICK III • MYSTERY-MULTI BY 4LANFIS<br />ROSENDAHL • COESFELD • BILLERBECK
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
